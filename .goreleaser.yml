version: 2
before:
  hooks:
    - go mod tidy
    - make lint
    - go test -race ./...

builds:
  - id: tetherd
    main: ./cmd/tetherd
    binary: tetherd
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/kyosu-1/tetherd/internal/version.Version={{.Version}}
  - id: tetherd-helper
    main: ./cmd/tetherd-helper
    binary: tetherd-helper
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/kyosu-1/tetherd/internal/version.Version={{.Version}}
  - id: tetherd-exec
    main: ./cmd/tetherd-exec
    binary: tetherd-exec
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/kyosu-1/tetherd/internal/version.Version={{.Version}}

archives:
  - ids: [tetherd, tetherd-helper, tetherd-exec]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - '^(docs|test|chore|build|ci|style|refactor)(\(.+\))?!?:'
      - "^Merge "

# homebrew_casks, not homebrew_formulae: a formula cannot strip the quarantine
# attribute Homebrew puts on what it downloads (Library/Homebrew/cask/
# download.rb quarantines every cask download), and these binaries are neither
# signed nor notarized. A cask can, in postflight_steps.
homebrew_casks:
  - repository:
      owner: kyosu-1
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/kyosu-1/tetherd
    description: mirrord-like local development environment for ECS Fargate
    # spec §8: the package puts three binaries in the prefix and nothing else.
    # tetherd-exec on PATH is harmless - the setgid copy that pf matches is
    # the one `tetherd-helper install` writes into a root-owned directory -
    # and shipping the same three keeps the package and the spec in step.
    # `binaries` (a list); the singular `binary` is deprecated.
    binaries:
      - tetherd
      - tetherd-helper
      - tetherd-exec
    # No `depends_on` for session-manager-plugin, deliberately. Two reasons,
    # both measured on a real machine:
    #
    #  - It is a **cask**, not a formula: `brew info --formula
    #    session-manager-plugin` answers "No available formula with the name
    #    ... Found a cask named ... instead". v0.4.0 shipped
    #    `dependencies: [formula: session-manager-plugin]` and `brew install`
    #    of this cask therefore failed outright.
    #  - `depends_on` asks "did Homebrew install it?", but what tetherd needs
    #    is "is it on PATH?". AWS documents its own installer, which puts it
    #    at /usr/local/sessionmanagerplugin with a symlink in
    #    /usr/local/bin - invisible to Homebrew. Declaring the dependency
    #    would demand a second, brew-managed copy from everyone who followed
    #    AWS's own instructions.
    #
    # internal/doctor's CheckPlugin measures the condition that actually
    # matters (LookPath) and already prints the right remedy,
    # `brew install --cask session-manager-plugin`.

    # custom_block, not hooks.post.install: hooks emit `postflight`, which
    # Homebrew raises MethodDeprecatedError for under HOMEBREW_DEVELOPER.
    # `{{"{{"}}` escapes GoReleaser's templater, which runs over the whole
    # generated cask; the token must reach the file as {{staged_path}}.
    custom_block: |
      postflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{"{{"}}staged_path}}"]
      end
    # These two paths are the one duplication the design cannot remove: a cask
    # is configuration and cannot read helper.DaemonLabel or
    # helper.ExecInstallDir. internal/helper's TestCaskAgreesWithTheGoConstants
    # fails if they drift, because a stale path here means `brew uninstall`
    # leaves the daemon running.
    uninstall:
      # A list: `launchctl` is []string in goreleaser's cask schema,
      # and a bare scalar is rejected by `goreleaser check`.
      launchctl:
        - dev.tetherd.helper
      delete:
        - /Library/LaunchDaemons/dev.tetherd.helper.plist
        - /usr/local/libexec/tetherd
    caveats: |
      tetherd needs a root helper for pf, /etc/resolver and the tetherd group:

        sudo tetherd-helper install

      Then run `tetherd doctor`. It checks everything else this needs,
      including the SSM session-manager-plugin, which is not installed as a
      dependency because AWS's own installer puts it somewhere Homebrew
      cannot see.

      Run that again after every upgrade - it reinstalls both binaries into a
      root-owned directory and restarts the daemon.
