# tetherd の検証環境（deploy/dev-env）に向けた設定例。
# リポジトリ直下に .tetherd.yml としてコピーすると、`tetherd run -- <cmd>` だけで動く。
#
#   cp examples/.tetherd.yml .tetherd.yml
#   tetherd doctor
#   tetherd run -- psql "postgres://tetherd@$RDS/app"
#
# キーの意味は docs/config.md を参照。
version: 1
aws:
  profile: personal
  region: ap-northeast-1
target:
  cluster: tetherd-dev
  service: api
  # 今は読まれるだけで使われない。env を読むコンテナは agent 側の
  # TETHERD_APP_CONTAINER（既定 app）で決まる。docs/config.md 参照
  container: app
  env: dev                # agent の TETHERD_ENV と一致しなければ接続を拒否する
network:
  remote_domains:
    - myapp.internal      # Cloud Map の名前を agent 側（VPC リゾルバ）で解決する
  # remote_services: [s3] # S3 への通信もタスクの ENI から出したいとき
  # local_cidrs: []       # VPC CIDR と自宅 LAN が重なっているときの逃げ道
  # pin_credential_route: true # 169.254.170.2 を直書きしているツールがあるときだけ（マシン全体に効く）
env:
  exclude: []
